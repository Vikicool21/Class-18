<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
body { background-color: #F0F0F2; }
h1 { color: #FF5A43; }
.card-label { font-size: 11px; color: #999; text-transform: uppercase; }
pre { font-size: 13px; color: #333; }

</style>
</head>
<body>
    <div class="container">
        <h1 class="mb-1">My phone contacts</h1>
            <p class="text-muted mb-4">introduction to object in java script</p>
            <div class="card shadow-sm mb-3" style = "max-width: 400px;">
                <div class="card-body">
                    <h5 class="card-title" style="color:#FF5A43;">Contact Details</h5>
<ul class="list-group list-group-flush">
<li class="list-group-item">
<span class="card-label d-block">Name</span>
<strong id="name">—</strong>
</li>
<li class="list-group-item">
<span class="card-label d-block">Phone</span>
<strong id="phone">—</strong>
</li>
<li class="list-group-item">
<span class="card-label d-block">School</span>
<strong id="school">—</strong>
</li>
<li class="list-group-item">
<span class="card-label d-block">City</span>
<strong id="city">—</strong>
</li>
</ul>
                </div>
            </div>
            <div class="card shadow-sm" style="max-width:400px;">

<div class="card-body">
<h6 style="color:#FF5A43;">JavaScript Object Used</h6>
<pre id="codeDisplay"
class="bg-light p-3 rounded border mb-0"></pre>
</div>
</div>
    </div>

    <script>
        object = {
            name: "Vighnesh",
            school: "IHS",
            phone: "1234567890",
            city: "dubai",
        } ;

        var name1 = document.getElementById("name");
        var contact =document.getElementById("phone");

        name1.textContent = object.name
        contact.textContent = object.phone

        var school1 = document.getElementById("school")
        var city1 = document.getElementById("city")

        school1.textContent = object["school"]
        city1.textContent = object["city"]
    </script>
</body>
</html>
